<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Digital - Gestor Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 flex flex-col items-center">
    <div class="max-w-md w-full space-y-4 pb-24">
        <header class="bg-blue-600 text-white p-4 rounded-xl text-center shadow space-y-1">
            <h1 id="titulo-catalogo" class="text-lg font-bold">Catálogo Online</h1>
            <p id="subtitulo-catalogo" class="text-xs text-blue-100">Selecciona tus productos para hacer pedidos por WhatsApp</p>
            <p id="whatsapp-catalogo-badge" class="text-[11px] text-blue-50/90 font-mono"></p>
        </header>

        <div id="catalogo-productos" class="space-y-3"></div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 p-3 bg-white/95 backdrop-blur border-t border-slate-200">
        <div class="max-w-md mx-auto space-y-2">
            <div class="flex justify-between items-center text-xs font-bold">
                <span>Total del Pedido:</span>
                <span id="lbl-total-pedido" class="text-emerald-600 text-sm">$0.00</span>
            </div>
            <button type="button" onclick="enviarPedidoWhatsApp()" class="w-full bg-emerald-600 text-white font-semibold py-2.5 rounded-xl text-xs hover:bg-emerald-700 transition">
                Enviar Pedido por WhatsApp
            </button>
        </div>
    </div>

    <script>
        const negocios = JSON.parse(localStorage.getItem('multinegocios')) || [];
        const negocioActualId = parseInt(localStorage.getItem('negocioActualId'), 10) || (negocios[0] ? negocios[0].id : 1);
        const neg = negocios.find(n => n.id === negocioActualId) || negocios[0] || {
            nombre: 'Tienda',
            whatsapp: '',
            inventario: []
        };

        let carrito = {};

        function normalizarTelefonoWhatsApp(raw) {
            const limpio = String(raw || '').replace(/\D/g, '');
            if (!limpio) return '';
            if (limpio.startsWith('0') && limpio.length === 11) {
                return '58' + limpio.slice(1);
            }
            return limpio;
        }

        function renderCatalogo() {
            const titulo = document.getElementById('titulo-catalogo');
            const badgeWa = document.getElementById('whatsapp-catalogo-badge');
            if (titulo) titulo.innerText = `Catálogo · ${neg.nombre}`;

            const telNormalizado = normalizarTelefonoWhatsApp(neg.whatsapp);
            if (badgeWa) {
                badgeWa.innerText = telNormalizado
                    ? `WhatsApp de pedidos: +${telNormalizado}`
                    : 'Configura el WhatsApp del negocio en Ajustes para recibir pedidos directos';
            }

            const cont = document.getElementById('catalogo-productos');
            if (!neg.inventario || neg.inventario.length === 0) {
                cont.innerHTML = `<p class="text-center text-xs text-slate-400 py-8 bg-white rounded-xl border">No hay productos disponibles en este momento.</p>`;
                return;
            }

            cont.innerHTML = neg.inventario.map(p => {
                const stockDisp = Math.max(0, parseInt(p.stock, 10) || 0);
                const cantActual = carrito[p.id] || 0;
                const fotoHtml = (p.foto && p.mostrarFotoPdf !== false)
                    ? `<img src="${p.foto}" alt="${p.nombre}" class="w-12 h-12 object-cover rounded-lg border border-slate-200 shrink-0">`
                    : `<div class="w-12 h-12 rounded-lg bg-slate-100 flex items-center justify-center text-base shrink-0">🛍️</div>`;

                return `
                    <div class="bg-white p-3.5 rounded-xl shadow-xs border border-slate-200 flex justify-between items-center gap-3">
                        <div class="flex items-center gap-2.5 min-w-0">
                            ${fotoHtml}
                            <div class="min-w-0">
                                <h3 class="text-sm font-semibold text-slate-800 truncate">${p.nombre}</h3>
                                <p class="text-xs text-emerald-600 font-bold mt-0.5">$${Number(p.venta || 0).toFixed(2)} <span class="text-[11px] text-slate-400 font-normal">(${stockDisp} disp.)</span></p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                            <button type="button" onclick="cambiarCantidad(${p.id}, -1)" class="bg-slate-100 hover:bg-slate-200 px-2.5 py-1.5 rounded-lg text-xs font-bold">-</button>
                            <span id="cant-${p.id}" class="text-xs font-bold w-5 text-center">${cantActual}</span>
                            <button type="button" onclick="cambiarCantidad(${p.id}, 1)" class="bg-blue-600 hover:bg-blue-700 text-white px-2.5 py-1.5 rounded-lg text-xs font-bold">+</button>
                        </div>
                    </div>
                `;
            }).join('');
            calcularTotal();
        }

        function cambiarCantidad(id, delta) {
            const prod = (neg.inventario || []).find(p => p.id === id);
            if (!prod) return;
            const stockMax = Math.max(0, parseInt(prod.stock, 10) || 0);
            let actual = carrito[id] || 0;
            actual += delta;
            if (actual < 0) actual = 0;
            if (actual > stockMax) {
                alert(`Solo hay ${stockMax} unidades disponibles de ${prod.nombre}.`);
                actual = stockMax;
            }
            if (actual === 0) delete carrito[id];
            else carrito[id] = actual;

            const span = document.getElementById(`cant-${id}`);
            if (span) span.innerText = actual;
            calcularTotal();
        }

        function calcularTotal() {
            let total = 0;
            for (const id in carrito) {
                const prod = (neg.inventario || []).find(p => String(p.id) === String(id));
                if (prod) total += Number(prod.venta || 0) * carrito[id];
            }
            document.getElementById('lbl-total-pedido').innerText = `$${total.toFixed(2)}`;
        }

        function enviarPedidoWhatsApp() {
            const items = Object.keys(carrito);
            if (items.length === 0) {
                alert('Selecciona al menos un producto.');
                return;
            }
            const telefonoComercio = normalizarTelefonoWhatsApp(neg.whatsapp);
            if (!telefonoComercio) {
                alert('El negocio aún no tiene un número de WhatsApp configurado en Ajustes.');
                return;
            }

            let texto = `Hola, deseo realizar un pedido en *${neg.nombre}*:\n`;
            let total = 0;
            items.forEach(id => {
                const prod = (neg.inventario || []).find(p => String(p.id) === String(id));
                if (!prod) return;
                const cant = carrito[id];
                const sub = Number(prod.venta || 0) * cant;
                total += sub;
                texto += `• ${prod.nombre} (x${cant}) - $${sub.toFixed(2)}\n`;
            });
            texto += `\n*Total estimado: $${total.toFixed(2)}*`;

            window.open(`https://api.whatsapp.com/send?phone=${telefonoComercio}&text=${encodeURIComponent(texto)}`, '_blank');
        }

        renderCatalogo();
    </script>
</body>
</html>
